<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 360" role="img" aria-labelledby="title desc">
  <title id="title">DNS log analysis processing flow</title>
  <desc id="desc">Collect DNS query logs, organize records, deduplicate domains, exclude whitelisted domains, match blacklists and suspicious characteristics, then trace the source device.</desc>
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#475569"/>
    </marker>
    <style>
      .frame { fill: #fff; stroke: #d8dee8; }
      .node rect { fill: #f8fafc; stroke: #64748b; stroke-width: 1.5; rx: 8; }
      .input rect { fill: #eef6ff; stroke: #2563eb; }
      .filter rect { fill: #f0fdf4; stroke: #16a34a; }
      .risk rect { fill: #fff7ed; stroke: #ea580c; }
      .arrow { stroke: #475569; stroke-width: 2; fill: none; marker-end: url(#arrowhead); }
      text {
        font-family: Arial, Helvetica, sans-serif;
        font-size: 17px;
        font-weight: 600;
        text-anchor: middle;
        dominant-baseline: middle;
        fill: #111827;
      }
    </style>
  </defs>

  <rect class="frame" x="20" y="20" width="1060" height="320" rx="8"/>

  <path class="arrow" d="M260 105 H335"/>
  <path class="arrow" d="M520 105 H595"/>
  <path class="arrow" d="M690 145 V220"/>
  <path class="arrow" d="M595 260 H520"/>
  <path class="arrow" d="M335 260 H260"/>

  <g class="node input" transform="translate(80 65)">
    <rect width="180" height="80"/>
    <text x="90" y="32">Collect DNS</text>
    <text x="90" y="54">query logs</text>
  </g>

  <g class="node" transform="translate(335 65)">
    <rect width="185" height="80"/>
    <text x="92.5" y="30">Organize by device,</text>
    <text x="92.5" y="54">time, and domain</text>
  </g>

  <g class="node filter" transform="translate(595 65)">
    <rect width="190" height="80"/>
    <text x="95" y="30">Deduplicate</text>
    <text x="95" y="54">queried domains</text>
  </g>

  <g class="node filter" transform="translate(595 220)">
    <rect width="190" height="80"/>
    <text x="95" y="30">Exclude</text>
    <text x="95" y="54">whitelist</text>
  </g>

  <g class="node risk" transform="translate(335 220)">
    <rect width="185" height="80"/>
    <text x="92.5" y="30">Match blacklists</text>
    <text x="92.5" y="54">and suspicious signs</text>
  </g>

  <g class="node risk" transform="translate(80 220)">
    <rect width="180" height="80"/>
    <text x="90" y="30">Trace source</text>
    <text x="90" y="54">device</text>
  </g>
</svg>
